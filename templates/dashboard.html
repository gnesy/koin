{% extends 'base.html' %}

{% block title %}Dashboard - Koin{% endblock %}

{% block content %}
<div class="w-full max-w-4xl mx-auto space-y-6 pb-20">
    
    <header class="flex justify-between items-center py-4 border-b border-gray-100">
        <div>
            <h2>{{ familia }}</h2>
            <h1 class="text-2xl font-bold text-koin-dark">¡Bienvenido Jefe de Familia, {{ nombre_completo }}!</h1>
            <p class="text-gray-500 text-sm">Resumen financiero de tu familia.</p>
        </div>
        
        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="text-gray-500 hover:text-red-500 p-2 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
        </form>
    </header>

    <div class="bg-koin-dark rounded-3xl p-6 text-white shadow-lg relative overflow-hidden">
        <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white opacity-10"></div>
        <h2 class="text-koin-light text-sm font-semibold mb-1">Balance Total</h2>
        <p class="text-4xl font-bold tracking-tight">$ 0.00</p>
        
        <div class="mt-6 flex gap-4">
            <button class="flex-1 bg-white text-koin-dark py-2 px-4 rounded-full font-semibold text-sm hover:bg-gray-100 transition-colors">
                + Ingreso
            </button>
            <button class="flex-1 bg-koin-light text-koin-dark py-2 px-4 rounded-full font-semibold text-sm hover:brightness-95 transition-colors">
                - Gasto
            </button>
        </div>
    </div>

    <div>
        <h3 class="text-lg font-bold text-gray-800 mb-3">Tus Cuentas</h3>
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                <div class="flex items-center gap-2 mb-2">
                    <div class="w-3 h-3 rounded-full bg-blue-500"></div>
                    <span class="text-sm font-medium text-gray-500">Banco</span>
                </div>
                <p class="text-xl font-bold text-gray-800">$ 0.00</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                <div class="flex items-center gap-2 mb-2">
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                    <span class="text-sm font-medium text-gray-500">Efectivo</span>
                </div>
                <p class="text-xl font-bold text-gray-800">$ 0.00</p>
            </div>
        </div>
    </div>

</div>
{% endblock %}
