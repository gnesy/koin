{% extends 'base.html' %}

{% block title %}Sign Up - Koin{% endblock %}

{% block content %}
<div class="w-full max-w-[400px] bg-white rounded-[32px] p-8 shadow-sm">
    
    <h2 class="text-3xl font-bold text-center mb-2 mt-4 text-koin-dark">Regístrate</h2>
    <p class="text-center text-gray-500 text-sm mb-8">Empieza a gestionar las finanzas de tu familia hoy.</p>
    
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <div class="relative">
            <span class="absolute inset-y-0 left-4 flex items-center text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </span>
            <input type="text" name="username" placeholder="Username" class="w-full pl-12 pr-4 py-3 bg-white border border-gray-200 rounded-full focus:outline-none focus:border-koin-dark focus:ring-1 focus:ring-koin-dark transition-colors" required>
        </div>

        <div class="relative">
            <span class="absolute inset-y-0 left-4 flex items-center text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </span>
            <input type="email" name="email" placeholder="Email" class="w-full pl-12 pr-4 py-3 bg-white border border-gray-200 rounded-full focus:outline-none focus:border-koin-dark focus:ring-1 focus:ring-koin-dark transition-colors" required>
        </div>

        <div class="relative">
            <span class="absolute inset-y-0 left-4 flex items-center text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </span>
            <input type="password" name="password" placeholder="Create Password" class="w-full pl-12 pr-4 py-3 bg-white border border-gray-200 rounded-full focus:outline-none focus:border-koin-dark focus:ring-1 focus:ring-koin-dark transition-colors" required>
        </div>

        <button type="submit" class="w-full bg-koin-dark text-white font-semibold rounded-full py-4 mt-6 hover:bg-opacity-90 transition-all shadow-md">
            Create Account
        </button>
    </form>

    <div class="text-center mt-8">
        <p class="text-sm text-gray-500">
            Already have an account? <a href="{% url 'login' %}" class="font-semibold text-koin-dark hover:underline">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
