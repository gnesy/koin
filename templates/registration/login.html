{% extends 'base.html' %}

{% block title %}Iniciar Sesión - Koin{% endblock %}

{% block content %}
<div class="w-full max-w-[400px] bg-white rounded-[32px] p-8 shadow-sm">
    
    <h2 class="text-3xl font-bold text-center mb-8 mt-4 text-koin-dark">Login</h2>
    
    <form method="POST" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}
        
        <div class="relative">
            <span class="absolute inset-y-0 left-4 flex items-center text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </span>
            <input type="email" name="username" placeholder="Email" class="w-full pl-12 pr-4 py-3 bg-white border border-gray-200 rounded-full focus:outline-none focus:border-koin-dark focus:ring-1 focus:ring-koin-dark transition-colors" required>
        </div>

        <div class="relative">
            <span class="absolute inset-y-0 left-4 flex items-center text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </span>
            <input type="password" name="password" placeholder="Password" class="w-full pl-12 pr-12 py-3 bg-white border border-gray-200 rounded-full focus:outline-none focus:border-koin-dark focus:ring-1 focus:ring-koin-dark transition-colors" required>
            
            <button type="button" class="absolute inset-y-0 right-4 flex items-center text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
        </div>

        <div class="text-center mt-2 mb-6">
            <a href="#" class="text-sm font-medium text-gray-500 hover:text-koin-dark transition-colors">Forgot Password?</a>
        </div>

        <button type="submit" class="w-full bg-koin-dark text-white font-semibold rounded-full py-4 hover:bg-opacity-90 transition-all shadow-md">
            Login
        </button>
    </form>

    <div class="flex items-center my-6">
        <div class="flex-grow border-t border-gray-100"></div>
        <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">or</span>
        <div class="flex-grow border-t border-gray-100"></div>
    </div>

    <div class="space-y-3">
        <button class="w-full flex items-center justify-center gap-3 bg-koin-gray text-gray-700 font-medium rounded-full py-3 hover:bg-gray-200 transition-colors">
            <span class="font-bold text-lg text-blue-500">G</span> Continue with Google
        </button>    
    </div>

    <div class="text-center mt-8">
        <p class="text-sm text-gray-500">
            Need an account? <a href="{% url 'registro' %}" class="font-semibold text-koin-dark hover:underline">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
